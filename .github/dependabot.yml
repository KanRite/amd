version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Ticket 247: only releases at least a week old, which is when a bad
    # one has usually been yanked or flagged. Security updates don't wait.
    cooldown:
      default-days: 7
    # Conventional commit prefix so Dependabot's commits pass commit validation
    # and read cleanly in the changelog. Its branch names are always
    # dependabot/… (with underscores), which the validation workflow accepts via
    # `branch-types: … dependabot` + `allow-underscores: "true"`.
    commit-message:
      prefix: "chore(deps)"

  # Rust crates (ticket 246): weekly, with every minor and patch update in
  # one grouped PR so it isn't noisy; a major update gets a PR of its own.
  # The Dependabot gate workflow applies it once it's checked (ticket 247).
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
