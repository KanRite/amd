name: Idea or request
description: Something rite or riteui could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The situation, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you'd like it to work, if you have an idea.
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - rite (the command line)
        - riteui (the desktop board)
        - Both
        - Not sure
