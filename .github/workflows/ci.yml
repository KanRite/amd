name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The workspace builds three times over (clippy, unit tests, the CLI
      # tests), and candle (ticket 187) is large: room first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      # The desktop board (crates/amd-ui) is a Tauri app: WebKitGTK on Linux.
      - name: Install the desktop board's system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libasound2-dev
      - name: Install Rust (stable + rustfmt + clippy + wasm32)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      # amdui embeds the board's pages at compile time, so they come first.
      - name: Build the desktop board's front end
        working-directory: crates/amd-ui-web
        run: trunk build --release
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Clippy (the board's front end, as WebAssembly)
        run: cargo clippy -p amd-ui-web -p amd-ui-model --target wasm32-unknown-unknown -- -D warnings
      - name: Unit tests
        run: cargo test --locked
      # The latest release, so the CLI tests check it still reads and
      # changes a board this build has written (ticket 193). Cached by its
      # tag, so CI downloads each release about once, rather than adding a
      # download to its count on every run.
      - name: Which release is the latest
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh release view --repo agile-md/amd --json tagName --jq .tagName || true)" >> "$GITHUB_OUTPUT"
      - name: Cache the previous release
        if: steps.latest.outputs.tag != ''
        uses: actions/cache@v6
        with:
          path: ~/previous-release
          key: previous-release-${{ steps.latest.outputs.tag }}-x86_64-linux
      - name: The previous release
        if: steps.latest.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.latest.outputs.tag }}
        run: |
          dir="$HOME/previous-release"
          if [ ! -x "$dir/amd" ]; then
            mkdir -p "$dir"
            gh release download "$TAG" --repo agile-md/amd \
              --pattern 'amd-x86_64-unknown-linux-gnu.zip' --dir "$dir" \
              && unzip -q -o "$dir/amd-x86_64-unknown-linux-gnu.zip" -d "$dir" \
              && rm -f "$dir/amd-x86_64-unknown-linux-gnu.zip" || true
          fi
          if [ -x "$dir/amd" ]; then echo "AMD_PREVIOUS=$dir/amd" >> "$GITHUB_ENV"; fi
      - name: CLI tests
        run: bash tests/test.sh

  # Windows (ticket 276): building and testing each crate on its own, every
  # step running even when one before failed, to find what breaks. Not a
  # required check, and allowed to fail, until it passes; the failures are
  # listed on ticket 276 with the ticket that fixes each.
  windows:
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (stable + wasm32)
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Build the desktop board's front end
        working-directory: crates/amd-ui-web
        run: trunk build --release
      - name: Library tests (amd-lib)
        if: ${{ !cancelled() }}
        run: cargo test --locked -p agile-md --no-fail-fast
      - name: Shared model tests (amd-ui-model)
        if: ${{ !cancelled() }}
        run: cargo test --locked -p amd-ui-model --no-fail-fast
      - name: Build amd
        if: ${{ !cancelled() }}
        run: cargo build --locked -p amd-cli
      - name: CLI unit tests
        if: ${{ !cancelled() }}
        run: cargo test --locked -p amd-cli --no-fail-fast
      - name: Build amdui
        if: ${{ !cancelled() }}
        run: cargo build --locked -p amd-ui
      - name: amdui unit tests
        if: ${{ !cancelled() }}
        run: cargo test --locked -p amd-ui --no-fail-fast

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -x --severity=warning install.sh tests/*.sh scripts/*.sh
