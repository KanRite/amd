name: Pages

# Publishes the project's website from pages/ (tickets 205, 211). Only a
# change under pages/ (or this file) on main runs it; workflow_dispatch
# republishes by hand. The repository's Pages source must be "GitHub
# Actions" (Settings → Pages).

on:
  push:
    branches: [main]
    paths:
      - "pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces one still queued, but a
# deployment already running finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages
      - id: deployment
        uses: actions/deploy-pages@v5
