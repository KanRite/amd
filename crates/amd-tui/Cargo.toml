# The terminal board: `amd-tui`, also reachable as `amd tui`. A third front
# end over `agile_md`, beside the command line and the desktop board; like
# them it never writes a ticket itself.
[package]
name = "amd-tui"
description = "The agile-md terminal board"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[lib]
name = "amd_tui"
path = "src/lib.rs"

[[bin]]
name = "amd-tui"
path = "src/main.rs"

[dependencies]
agile-md.workspace = true
anyhow.workspace = true
ratatui.workspace = true

[dev-dependencies]
tempfile.workspace = true
