# Deliberately its own workspace, not a member of the main one — see the
# description below.
[workspace]

[package]
name = "amd-tauri"
version = "0.1.0"
description = "Spike: the agile-md desktop board, rebuilt on Tauri instead of egui/eframe (ticket 078). Not part of the main workspace on purpose — see its own Cargo.lock."
authors = []
license = "MIT"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "amd_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
# The whole point of the spike: amd-lib, consumed exactly the way amd-cli
# and amd-ui already do (docs/adr/0004's "one library, two interfaces" —
# this is the third). No amd-lib changes should be needed for this to work.
agile-md = { path = "../../amd-lib" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = [] }
tauri-plugin-log = "2"
