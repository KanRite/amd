# Types and pure rules shared by the desktop board's Tauri backend (amd-ui)
# and its Leptos front end (amd-ui-web). It compiles to WebAssembly, so it
# holds no file, git or settings logic — that is amd-lib's, which the
# backend calls (ticket 084).
[package]
name = "amd-ui-model"
description = "Types shared by the agile-md desktop board's backend and front end"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
deunicode.workspace = true
pulldown-cmark.workspace = true
serde.workspace = true
