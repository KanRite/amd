# A workspace of three crates: one library, two interfaces (docs/adr/0004).
#
# The boundary is enforced here rather than by review — amd-lib does not list
# clap, inquire or egui, so a front-end dependency reaching into the library
# fails to compile rather than passing review.
[workspace]
resolver = "3"
members = ["crates/amd-lib", "crates/amd-cli", "crates/amd-ui"]

[workspace.package]
version = "4.0.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/mrdoodles/agile-md"
license = "MIT"

[workspace.dependencies]
agile-md = { path = "crates/amd-lib" }
anyhow = "1"
clap = { version = "4", features = ["derive", "string"] }
clap_complete = "4"
deunicode = "1.6.2"
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "wayland",
    "x11",
] }
inquire = "0.9"
libc = "0.2.189"
minijinja = "2"
richrs = "0.2"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
